name: tapguard
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  flutter_riverpod: ^3.2.1
  google_fonts: ^8.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.1
  nfc_manager: ^4.1.1
  permission_handler: ^12.0.0
  shake: ^3.0.0
  share_plus: ^12.0.0
  shared_preferences: ^2.3.0
  ndef_record: ^1.4.0
  http: ^1.2.0
  url_launcher: ^6.2.0
  mailer: ^7.1.0
  vibration: ^2.0.0
  onesignal_flutter: ^5.2.5
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  # Direct SMS dispatch for SOS alerts (replaces the broken `sms:` URI).
  telephony: ^0.2.0
  # Deep-link handling so the SMS shareUrl opens the app if installed
  # instead of falling back to the browser web page.
  app_links: ^6.3.2
  # AI risk detection (Phase 1)
  tflite_flutter: ^0.11.0
  # Pinned to 5.1.2 because 5.2.0+ requires record_platform_interface
  # 1.6.0+, which is incompatible with record_linux 0.7.2 (the
  # latest 0.x). record_linux 1.x+ needs record_platform_interface
  # 2.x, which needs record 7.x (requires Dart 3.12). 5.1.2 is the
  # last version that works with the 0.7.x Linux implementation.
  record: 5.1.2
  battery_plus: ^6.0.0
  connectivity_plus: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sensors_plus: ^6.1.2
  # Load secrets from .env at runtime so SMTP / OneSignal / Firebase
  # keys never get committed. See docs/SECURITY.md.
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Phase 1 — force record_platform_interface to 1.5.x and override
# record_linux to a 1.3.x version that implements the current
# interface signatures. record_linux 0.7.x and 1.0.x–1.2.x lack
# `startStream(String, RecordConfig)` and/or the `request`
# parameter on `hasPermission`. 1.3.0+ has both. The 2.x line of
# record_linux requires Dart 3.12+, which we don't have.
dependency_overrides:
  record_platform_interface: 1.5.0
  record_linux: 1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    # .env is bundled into the app so flutter_dotenv can read it at
    # runtime. The file itself is gitignored (see .gitignore). Use
    # .env.example as the committed template.
    - .env
