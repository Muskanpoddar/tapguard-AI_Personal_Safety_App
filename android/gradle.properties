org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Workaround for Kotlin incremental compilation failing on Windows when
# project (E:) and pub cache (C:) live on different drive roots. The
# cross-drive path comparison in kotlin incremental storage throws
# IllegalArgumentException at compileDebugKotlin. Disabling incremental
# forces a full recompile but avoids the cross-drive bug.
kotlin.incremental=false
